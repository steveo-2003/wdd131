<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="styles.css" />
  <script src="week_8.js" defer></script>
  <title>Character Card</title>
</head>

<body>
    <div class="card">
        <img id="characterImage" class="image" alt="Character Image" />
        <div class="name" id="characterName"></div>
        <div class="stats">
            <p id="characterClass"></p>
            <p id="characterLevel"></p>
            <p id="characterHealth"></p>
        </div>
        <div class="buttons">
            <button id="attackButton">Attack</button>
            <button id="levelUpButton">Level Up</button>
        </div>
    </div>
</body>
</html>
